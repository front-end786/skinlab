services:
  db:
    image: postgres:16-alpine
    env_file: .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-rls-user.sql:/docker-entrypoint-initdb.d/init-rls-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.docker
    volumes:
      - ./backend:/app
      - ./mcp_server:/mcp_server
      - backend_venv:/app/.venv
      - ./docker/backend/entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /bin/bash /entrypoint.sh

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.docker
    volumes:
      - ./backend:/app
      - ./mcp_server:/mcp_server
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "uv sync --frozen && exec uv run celery -A crm worker --loglevel=info"

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.docker
    volumes:
      - ./backend:/app
      - ./mcp_server:/mcp_server
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "uv sync --frozen && exec uv run celery -A crm beat --loglevel=info"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: .env.docker
    environment:
      MONGODB_URI: mongodb://mongo:27017/skinlab
      AUTH_SECRET: skinlab-dev-auth-secret
      PUBLIC_DJANGO_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
  backend_venv:
  frontend_node_modules:
